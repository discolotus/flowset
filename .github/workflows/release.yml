name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: discolotus/release-workflows/.github/workflows/release-macos-app.yml@v1
    with:
      app_name: Flowset
      test_command: ./scripts/verify_release_ci.sh
      package_command: ./scripts/package_shared_release.sh
      artifact_path: dist/release/Flowset-{version}-arm64.zip
      cask_path: dist/release/flowset.rb
      prerelease: true
      allow_initial: true
