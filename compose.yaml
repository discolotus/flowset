services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playlist_optimizer
      POSTGRES_USER: playlist_optimizer
      POSTGRES_PASSWORD: playlist_optimizer
    ports:
      - "5432:5432"
    volumes:
      - playlist-optimizer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlist_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  playlist-optimizer-data:
