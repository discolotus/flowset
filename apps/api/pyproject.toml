[project]
name = "playlist-optimizer-api"
version = "0.1.0"
description = "FastAPI service and optimization core for Spotify Playlist Optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "httpx>=0.28.0,<1.0",
  "pydantic-settings>=2.7.0,<3.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "ruff>=0.11.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
